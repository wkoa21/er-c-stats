# 전적 사이트 저장소에 `.github/workflows/build-stats.yml` 로 넣는 파일입니다.
# data.json 이 바뀌어 저장소에 올라올 때마다 stats.json(봇이 읽는 가벼운 요약)을 자동으로 다시 만들어 줍니다.
name: Build bot stats

on:
  push:
    paths:
      - "data.json"
  workflow_dispatch: # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write # stats.json 을 저장소에 올리기 위해 필요

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build stats.json
        run: node scripts/build-stats.mjs data.json stats.json

      - name: Commit stats.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || (git commit -m "chore: update stats.json" && git push)
